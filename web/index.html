<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Print247 local chat</title>
<style>
  :root {
    --ink: #15221b;
    --muted: #6b7f71;
    --line: #d8e2db;
    --accent: #146c43;
    --accent-soft: #e7f3ec;
    --paper: #ffffff;
    --canvas: #eef3ef;
    --warn-bg: #fff8e6;
    --warn-line: #f0dfae;
    --warn-ink: #6b5200;
    --debug-bg: #0f1b14;
    --debug-line: #223b2c;
    --debug-ink: #d6e6db;
    --debug-muted: #8fa99a;
    --block: #ff9b9b;
    --warn: #ffd479;
    --info: #9fc7ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--canvas);
    color: var(--ink);
  }
  .topbar {
    max-width: 1280px;
    margin: 0 auto;
    padding: 16px 18px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 12px; }
  .mark {
    width: 42px; height: 42px; border-radius: 12px;
    background: var(--accent); color: #fff;
    display: grid; place-items: center;
    font-weight: 800; font-size: 13px; letter-spacing: .5px;
  }
  h1 { margin: 0; font-size: 18px; letter-spacing: -.2px; }
  .brand p { margin: 2px 0 0; color: var(--muted); font-size: 12px; }
  .status { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .badge {
    display: inline-flex; align-items: center;
    padding: 5px 10px; border-radius: 999px;
    font-size: 11.5px; font-weight: 600; letter-spacing: .2px;
    background: #e8efe9; color: #41564a; border: 1px solid transparent;
  }
  .badge.fake { background: #e8efe9; color: #41564a; }
  .badge.live { background: #d8f3e2; color: #0c5c36; }
  .badge.dry_run, .badge.shadow { background: #fff1cc; color: #745300; }
  .badge.muted { background: transparent; border-color: var(--line); color: var(--muted); font-weight: 500; }
  button {
    font: inherit; cursor: pointer;
    border: 0; border-radius: 10px;
    padding: 9px 14px;
    background: var(--accent); color: #fff;
    font-weight: 600; font-size: 13px;
  }
  button:hover { filter: brightness(1.06); }
  button:disabled { opacity: .55; cursor: not-allowed; }
  .ghost {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); font-weight: 500;
  }
  .layout {
    max-width: 1280px;
    margin: 0 auto;
    padding: 14px 18px 18px;
    display: grid;
    grid-template-columns: minmax(0, 1fr) 440px;
    gap: 16px;
    height: calc(100vh - 76px);
  }
  .chat-card {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(20, 50, 32, .05);
  }
  .messages {
    flex: 1; min-height: 0;
    overflow-y: auto;
    padding: 22px 22px 12px;
    display: flex; flex-direction: column; gap: 14px;
    scroll-behavior: smooth;
  }
  .msg { display: flex; flex-direction: column; }
  .msg.visitor { align-items: flex-end; }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    line-height: 1.5;
    white-space: pre-wrap;
    overflow-wrap: anywhere;
    font-size: 14px;
  }
  .msg.bot .bubble {
    background: #f1f6f2; border: 1px solid #dce8df;
    border-bottom-left-radius: 4px;
  }
  .msg.visitor .bubble {
    background: var(--accent); color: #fff;
    border-bottom-right-radius: 4px;
  }
  .meta { font-size: 11px; color: var(--muted); margin-top: 4px; padding: 0 4px; }
  .msg.system { align-items: center; }
  .msg.system .bubble {
    background: var(--warn-bg);
    border: 1px solid var(--warn-line);
    color: var(--warn-ink);
    border-radius: 999px;
    font-size: 12.5px;
    max-width: 92%;
    text-align: center;
    padding: 8px 14px;
  }
  .typing { display: inline-flex; gap: 4px; align-items: center; padding: 4px 2px; }
  .typing i {
    width: 6px; height: 6px; border-radius: 50%;
    background: #7d9b88; animation: blink 1.2s infinite;
  }
  .typing i:nth-child(2) { animation-delay: .15s; }
  .typing i:nth-child(3) { animation-delay: .3s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .composer {
    display: flex; flex-direction: column; gap: 8px;
    padding: 12px 14px;
    border-top: 1px solid #e3ebe5;
    background: #fbfdfb;
  }
  .composer-row {
    display: flex; gap: 10px; align-items: flex-end;
  }
  .attach-preview {
    display: none;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border: 1px solid #d5e3d9;
    border-radius: 12px;
    background: #f3f8f4;
  }
  .attach-preview.show { display: flex; }
  .attach-preview img {
    width: 48px; height: 48px; object-fit: cover;
    border-radius: 8px; border: 1px solid #cfe0d4;
  }
  .attach-preview .meta-col { flex: 1; min-width: 0; }
  .attach-preview .name {
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .attach-preview .hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .attach-preview .clear {
    background: transparent; color: var(--muted);
    border: 1px solid var(--line); padding: 6px 10px; font-weight: 500;
  }
  .icon-btn {
    width: 44px; height: 44px; flex: 0 0 44px;
    display: grid; place-items: center;
    background: transparent; color: var(--ink);
    border: 1px solid #cad9cf; border-radius: 12px;
    padding: 0; font-size: 18px; line-height: 1;
  }
  .icon-btn:hover { background: #eef5f0; }
  textarea {
    flex: 1;
    resize: none;
    border: 1px solid #cad9cf;
    border-radius: 12px;
    padding: 11px 13px;
    font: inherit;
    font-size: 14px;
    line-height: 1.4;
    min-height: 44px;
    max-height: 140px;
    outline: none;
    background: #fff;
    color: var(--ink);
  }
  textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(20, 108, 67, .12);
  }
  .bubble.with-image { display: grid; gap: 8px; }
  .bubble.with-image img {
    max-width: 220px; max-height: 160px; border-radius: 10px;
    display: block; object-fit: cover;
  }
  .foot {
    display: flex; justify-content: space-between; gap: 10px;
    padding: 0 16px 10px;
    font-size: 11px; color: var(--muted);
    background: #fbfdfb;
  }
  .debug-card {
    background: var(--debug-bg);
    color: var(--debug-ink);
    border: 1px solid var(--debug-line);
    border-radius: 16px;
    padding: 16px;
    overflow-y: auto;
    font-size: 12px;
    line-height: 1.45;
  }
  .debug-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; margin-bottom: 12px;
  }
  .debug-card h2 { margin: 0; font-size: 13px; letter-spacing: .4px; text-transform: uppercase; color: #b9d2c3; }
  .debug-card h3 {
    margin: 16px 0 7px;
    font-size: 10.5px; letter-spacing: .8px; text-transform: uppercase;
    color: var(--debug-muted); font-weight: 600;
  }
  .switch { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--debug-muted); cursor: pointer; }
  .switch input { accent-color: #4ea978; }
  .debug-card .empty { color: var(--debug-muted); font-size: 12px; }
  .summary { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    background: #17291e; border: 1px solid #244030;
    color: #c9ddcf; border-radius: 999px;
    padding: 4px 9px; font-size: 10.5px;
  }
  .issue {
    background: #17251c;
    border: 1px solid var(--debug-line);
    border-left: 3px solid var(--info);
    border-radius: 8px;
    padding: 8px 10px;
    margin-bottom: 6px;
  }
  .issue.block { border-left-color: var(--block); }
  .issue.warn { border-left-color: var(--warn); }
  .issue strong { display: block; font-size: 11px; color: #eef7f0; margin-bottom: 2px; }
  .issue span { display: block; color: #b9cfc0; }
  .issue code {
    display: inline-block; margin-top: 5px; padding: 2px 6px;
    border-radius: 5px; background: #0b130e; color: #9fc7a9;
    font-size: 10.5px; overflow-wrap: anywhere;
  }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; margin: 0; }
  .kv dt { color: var(--debug-muted); }
  .kv dd { margin: 0; color: #e2f0e6; overflow-wrap: anywhere; }
  .chunks { display: flex; flex-direction: column; gap: 5px; }
  .chunk {
    background: #17251c; border: 1px solid var(--debug-line);
    border-radius: 7px; padding: 7px 9px;
  }
  .chunk b { color: #dcebe0; font-weight: 600; }
  .chunk span { color: var(--debug-muted); }
  .debug-note { color: var(--debug-muted); font-size: 11px; margin: 0 0 4px; }
  .who { display: block; color: var(--debug-muted); font-size: 10.5px; margin-bottom: 3px; }
  .ask-line { margin: 0 0 4px; color: #c9ddcf; overflow-wrap: anywhere; }
  .goal-line, .config-line { margin: 0 0 4px; overflow-wrap: anywhere; }
  .goal-line b, .config-line b { color: #e2f0e6; font-weight: 600; }
  .goal-line span, .config-line span { display: block; color: var(--debug-muted); }
  .state-attested { color: #8fd6a8; }
  .state-unknown_capability, .state-excluded { color: var(--warn); }
  .turn {
    border: 1px solid var(--debug-line);
    border-radius: 10px;
    padding: 10px;
    margin-bottom: 10px;
    background: #122018;
  }
  .turn h4 { margin: 0 0 8px; font-size: 12.5px; color: #e7f3ec; font-weight: 650; }
  .subhead {
    margin: 10px 0 6px;
    font-size: 10px; letter-spacing: .6px; text-transform: uppercase;
    color: var(--debug-muted); font-weight: 600;
  }
  @media (max-width: 920px) {
    .layout { grid-template-columns: 1fr; height: auto; }
    .chat-card { height: calc(100vh - 130px); min-height: 420px; }
    .debug-card { max-height: 460px; }
    .bubble { max-width: 88%; }
  }
  @media (max-width: 560px) {
    .topbar { padding-top: 12px; }
    .layout { padding: 10px 10px 14px; gap: 10px; }
    .messages { padding: 16px 14px 8px; }
    .status .badge.muted { display: none; }
    .foot { flex-direction: column; gap: 2px; }
  }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand">
    <div class="mark">P247</div>
    <div>
      <h1>Print247 chat</h1>
      <p>Local bot test console</p>
    </div>
  </div>
  <div class="status">
    <span id="mode-badge" class="badge muted">loading</span>
    <span id="kb-badge" class="badge muted">KB</span>
    <button id="new-chat" class="ghost" type="button">New chat</button>
  </div>
</header>

<main class="layout">
  <section class="chat-card">
    <div id="messages" class="messages" aria-live="polite"></div>
    <form id="composer" class="composer">
      <div id="attach-preview" class="attach-preview" hidden>
        <img id="attach-thumb" alt="Selected reference">
        <div class="meta-col">
          <div id="attach-name" class="name">reference image</div>
          <div class="hint">Reference image for the quote</div>
        </div>
        <button id="attach-clear" class="clear" type="button">Remove</button>
      </div>
      <div class="composer-row">
        <input id="attach-input" type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden>
        <button id="attach-btn" class="icon-btn" type="button" title="Attach or paste (Ctrl+V) a reference image" aria-label="Attach or paste a reference image">📎</button>
        <textarea id="input" rows="1" placeholder="Type a message, attach, or paste (Ctrl+V) a reference..." maxlength="4000" autocomplete="off"></textarea>
        <button id="send" type="submit">Send</button>
      </div>
    </form>
    <div class="foot">
      <span id="mode-note">Checking mode...</span>
      <span>Enter to send · Shift+Enter for a new line · Ctrl+V to paste an image</span>
    </div>
  </section>

  <aside class="debug-card" aria-label="Turn debug output">
    <div class="debug-head">
      <h2>Debug</h2>
      <label class="switch"><input id="debug-toggle" type="checkbox" checked> Show</label>
    </div>
    <div id="debug-empty" class="empty">Send a message to see the pipeline output.</div>
    <div id="debug-content" hidden></div>
  </aside>
</main>

<script>
(() => {
  const FIELD_LABELS = {
    product: "Product", style: "Style", sizes: "Size", finishes: "Finish",
    quantity: "Quantity", skus: "Designs / SKUs", material: "Material",
    extras: "Extras", name: "Name", email: "Email", phone: "Phone"
  };
  const HANDOFF_TEXT = {
    human: "A packaging specialist will take over from here.",
    complex: "Several topics came up, so a specialist will cover the rest.",
    max_turns: "A specialist will help finish this conversation.",
    quote: "Everything needed for the quote is collected. The team will email it.",
    stalled: "A specialist will take over to help with the rest.",
    declined: "No problem. A specialist can help with the rest."
  };

  const els = {
    messages: document.getElementById("messages"),
    input: document.getElementById("input"),
    send: document.getElementById("send"),
    composer: document.getElementById("composer"),
    newChat: document.getElementById("new-chat"),
    modeBadge: document.getElementById("mode-badge"),
    kbBadge: document.getElementById("kb-badge"),
    modeNote: document.getElementById("mode-note"),
    debugToggle: document.getElementById("debug-toggle"),
    debugEmpty: document.getElementById("debug-empty"),
    debugContent: document.getElementById("debug-content"),
    attachInput: document.getElementById("attach-input"),
    attachBtn: document.getElementById("attach-btn"),
    attachPreview: document.getElementById("attach-preview"),
    attachThumb: document.getElementById("attach-thumb"),
    attachName: document.getElementById("attach-name"),
    attachClear: document.getElementById("attach-clear")
  };

  let conversationId = newId();
  let busy = false;
  let handedOff = false;
  let handoffLocked = false;
  let debugEnabled = true;
  let debugTurns = [];
  let typingElement = null;
  let pendingImage = null;

  function newId() {
    if (window.crypto && typeof window.crypto.randomUUID === "function") {
      return window.crypto.randomUUID();
    }
    return "ui-" + Date.now() + "-" + Math.random().toString(16).slice(2);
  }

  function node(tag, className, text) {
    const element = document.createElement(tag);
    if (className) element.className = className;
    if (text !== undefined && text !== null) element.textContent = text;
    return element;
  }

  function addMessage(role, text, meta, imageUrl) {
    const wrap = node("div", "msg " + role);
    const bubble = node("div", "bubble" + (imageUrl ? " with-image" : ""));
    if (imageUrl) {
      const img = node("img");
      img.src = imageUrl;
      img.alt = "Reference image";
      bubble.appendChild(img);
    }
    if (text) bubble.appendChild(document.createTextNode(text));
    wrap.appendChild(bubble);
    if (meta) wrap.appendChild(node("div", "meta", meta));
    els.messages.appendChild(wrap);
    els.messages.scrollTop = els.messages.scrollHeight;
    return wrap;
  }

  function addSystem(text) {
    addMessage("system", text);
  }

  function addBot(turn) {
    addMessage("bot", turn.reply, turn.persona + " · " + turn.source + " · " + turn.elapsed_ms + " ms");
  }

  function clearPendingImage() {
    pendingImage = null;
    els.attachInput.value = "";
    els.attachThumb.removeAttribute("src");
    els.attachPreview.classList.remove("show");
    els.attachPreview.hidden = true;
  }

  function setPendingImage(file, dataUrl, mime) {
    pendingImage = { file, dataUrl, mime, base64: dataUrl.split(",", 2)[1] || "" };
    els.attachThumb.src = dataUrl;
    els.attachName.textContent = file.name || "reference image";
    els.attachPreview.hidden = false;
    els.attachPreview.classList.add("show");
  }

  function readFileAsDataUrl(file) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve(String(reader.result || ""));
      reader.onerror = () => reject(new Error("Could not read that image."));
      reader.readAsDataURL(file);
    });
  }

  async function acceptImageFile(file, label) {
    if (!file) return false;
    if (!String(file.type || "").startsWith("image/")) {
      clearPendingImage();
      addSystem("Please choose a JPG, PNG, WebP, or GIF image.");
      return false;
    }
    if (file.size > 8 * 1024 * 1024) {
      clearPendingImage();
      addSystem("Image is too large (max 8MB).");
      return false;
    }
    try {
      const dataUrl = await readFileAsDataUrl(file);
      const named = file.name
        ? file
        : new File([file], label || "pasted-image.png", { type: file.type || "image/png" });
      setPendingImage(named, dataUrl, named.type || file.type || "image/jpeg");
      return true;
    } catch (error) {
      clearPendingImage();
      addSystem(error.message || "Could not read that image.");
      return false;
    }
  }

  function imageFileFromClipboard(clipboardData) {
    if (!clipboardData) return null;
    const items = clipboardData.items ? Array.from(clipboardData.items) : [];
    for (const item of items) {
      if (item && item.kind === "file" && String(item.type || "").startsWith("image/")) {
        const file = item.getAsFile();
        if (file) return file;
      }
    }
    const files = clipboardData.files ? Array.from(clipboardData.files) : [];
    return files.find((file) => String(file.type || "").startsWith("image/")) || null;
  }

  async function handleImagePaste(event) {
    if (busy || handoffLocked) return;
    const file = imageFileFromClipboard(event.clipboardData);
    if (!file) return;
    event.preventDefault();
    await acceptImageFile(file, "pasted-image.png");
    els.input.focus();
  }

  function showTyping() {
    if (typingElement) return;
    typingElement = node("div", "msg bot");
    const bubble = node("div", "bubble");
    const dots = node("span", "typing");
    for (let i = 0; i < 3; i++) dots.appendChild(node("i"));
    bubble.appendChild(dots);
    typingElement.appendChild(bubble);
    els.messages.appendChild(typingElement);
    els.messages.scrollTop = els.messages.scrollHeight;
  }

  function hideTyping() {
    if (typingElement && typingElement.parentNode) typingElement.parentNode.removeChild(typingElement);
    typingElement = null;
  }

  function setBusy(value) {
    busy = value;
    const locked = value || handoffLocked;
    els.send.disabled = locked;
    els.input.disabled = locked;
    els.attachBtn.disabled = locked;
    els.attachClear.disabled = locked;
    if (value) showTyping(); else hideTyping();
  }

  function setHandedOff(reason) {
    handedOff = Boolean(reason);
    handoffLocked = reason === "quote";
    const locked = busy || handoffLocked;
    els.send.disabled = locked;
    els.input.disabled = locked;
    els.attachBtn.disabled = locked;
    els.attachClear.disabled = locked;
    if (handedOff) {
      const note = handoffLocked ? "" : " Local demo: you can keep chatting.";
      addSystem((HANDOFF_TEXT[reason] || HANDOFF_TEXT.human) + note);
    }
  }

  async function post(path, body) {
    const response = await fetch(path, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    if (!response.ok) throw new Error("HTTP " + response.status);
    return response.json();
  }

  async function loadHealth() {
    try {
      const response = await fetch("/health");
      const data = await response.json();
      const mode = data.mode || "unknown";
      els.modeBadge.textContent = mode;
      els.modeBadge.className = "badge " + mode;
      els.kbBadge.textContent = "KB " + (data.kb && data.kb.chunks ? data.kb.chunks : 0) + " chunks";
      els.modeNote.textContent = data.real_llm_enabled
        ? "Live LLM enabled: replies can cost money."
        : "Fake mode: heuristic replies, no API calls.";
    } catch (error) {
      els.modeBadge.textContent = "offline";
      els.modeNote.textContent = "Could not read /health.";
    }
  }

  async function startChat() {
    handedOff = false;
    handoffLocked = false;
    debugTurns = [];
    clearPendingImage();
    els.messages.replaceChildren();
    renderDebug();
    setBusy(true);
    try {
      const turn = await post("/api/start", { conversation_id: conversationId });
      if (turn.reply) addBot(turn);
      if (turn.handoff) setHandedOff(turn.handoff);
      recordTurn(turn, "");
    } catch (error) {
      addSystem("Could not start the chat: " + error.message);
    } finally {
      setBusy(false);
      els.input.focus();
    }
  }

  async function sendMessage() {
    const text = els.input.value.trim();
    const image = pendingImage;
    if ((!text && !image) || busy || handoffLocked) return;
    els.input.value = "";
    els.input.style.height = "auto";
    clearPendingImage();
    addMessage("visitor", text || "Shared a reference image", null, image ? image.dataUrl : null);
    setBusy(true);
    try {
      const body = { conversation_id: conversationId, text };
      if (image) {
        body.image_base64 = image.base64;
        body.image_mime = image.mime;
      }
      const turn = await post("/api/chat", body);
      if (turn.reply) addBot(turn);
      if (turn.handoff) setHandedOff(turn.handoff);
      recordTurn(turn, text || "[shared a reference image]");
    } catch (error) {
      addSystem("Request failed: " + error.message);
    } finally {
      setBusy(false);
      els.input.focus();
    }
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
  }

  function clip(text, limit) {
    const value = String(text || "").replace(/\s+/g, " ").trim();
    if (value.length <= limit) return value;
    return value.slice(0, limit - 1) + "…";
  }

  function turnLabel(turn, index) {
    if (turn.visitor) return '"' + clip(turn.visitor, 72) + '"';
    if (index === 0) return "greeting";
    return "turn " + (index + 1);
  }

  function draftGroups(turn) {
    if (turn.rejected_drafts && turn.rejected_drafts.length) return turn.rejected_drafts;
    if (turn.blocked && turn.blocked.length) return [{ stage: "draft", issues: turn.blocked }];
    return [];
  }

  function issueRow(issue, severity) {
    const row = node("div", "issue " + (severity || issue.severity || ""));
    row.appendChild(node("strong", null, (issue.code || "issue") + (issue.severity ? " · " + issue.severity : "")));
    if (issue.detail) row.appendChild(node("span", null, issue.detail));
    if (issue.excerpt) row.appendChild(node("code", null, issue.excerpt));
    return row;
  }

  function appendIssues(parent, issues, emptyText) {
    if (!issues || !issues.length) {
      if (emptyText) parent.appendChild(node("p", "empty", emptyText));
      return;
    }
    issues.forEach((issue) => parent.appendChild(issueRow(issue)));
  }

  function appendConfigs(parent, rows) {
    if (!rows || !rows.length) {
      parent.appendChild(node("p", "empty", "None."));
      return;
    }
    rows.forEach((item) => {
      const parts = [];
      ["style", "material", "finish", "insert", "extras"].forEach((key) => {
        const values = item[key];
        if (values && values.length) parts.push(key + ": " + values.join(", "));
      });
      const line = node("div", "config-line");
      const state = item.state || "";
      line.appendChild(node("b", state ? "state-" + state : "", (item.family || "config") + (state ? " · " + state : "")));
      if (parts.length) line.appendChild(document.createTextNode(" — " + parts.join(" · ")));
      if (item.reason) line.appendChild(node("span", null, item.reason));
      parent.appendChild(line);
    });
  }

  function recordTurn(turn, visitorText) {
    debugTurns.push(Object.assign({}, turn, {
      visitor: (turn && turn.visitor) || visitorText || ""
    }));
    renderDebug();
  }

  function renderTurn(turn, index) {
    const card = node("section", "turn");
    card.appendChild(node("h4", null, "Turn " + (index + 1) + " · " + turnLabel(turn, index)));

    const chips = node("div", "summary");
    const labels = [
      "source: " + (turn.source || "none"),
      "persona: " + (turn.persona || ""),
      "handoff: " + (turn.handoff || "none"),
      "elapsed: " + (turn.elapsed_ms || 0) + " ms",
      "move: " + (turn.move || "none")
    ];
    const context = turn.context || {};
    if (context.tier) labels.push("context: " + context.tier);
    if (context.primer_tokens) labels.push("primer: " + context.primer_tokens + " tokens");
    if (context.prompt_chunks) labels.push("chunks in prompt: " + context.prompt_chunks);
    if (context.prompt_tokens) labels.push("prompt tokens: " + context.prompt_tokens);
    if (context.completion_tokens) labels.push("completion tokens: " + context.completion_tokens);
    if (context.cost_usd) labels.push("cost: $" + context.cost_usd);
    if (context.latency_ms) labels.push("llm: " + context.latency_ms + " ms");
    if (turn.flags && turn.flags.llm_error) labels.push("llm error: " + turn.flags.llm_error);
    labels.forEach((label) => chips.appendChild(node("span", "chip", label)));
    card.appendChild(chips);

    if (turn.reply) {
      card.appendChild(node("p", "ask-line", clip(turn.reply, 220)));
    }

    card.appendChild(node("div", "subhead", "Sent reply issues"));
    appendIssues(card, turn.issues, "No guard issues on the reply that was sent.");

    const drafts = draftGroups(turn);
    card.appendChild(node("div", "subhead", "Rejected drafts"));
    if (!drafts.length) {
      card.appendChild(node("p", "empty", "None."));
    } else {
      drafts.forEach((draft) => {
        card.appendChild(node("p", "ask-line", (draft.stage || "draft") + (draft.move ? " · move: " + draft.move : "")));
        appendIssues(card, draft.issues, "No issues recorded.");
        if (draft.registry && draft.registry.length) appendConfigs(card, draft.registry);
        else if (draft.configs && draft.configs.length) appendConfigs(card, draft.configs);
      });
    }

    card.appendChild(node("div", "subhead", "Proposed configs"));
    appendConfigs(card, turn.registry && turn.registry.length ? turn.registry : turn.proposed_configs);

    card.appendChild(node("div", "subhead", "Goal changes this turn"));
    const accepted = turn.accepted || {};
    const rejected = turn.rejected || {};
    const acceptedKeys = Object.keys(accepted);
    const rejectedKeys = Object.keys(rejected);
    if (!acceptedKeys.length && !rejectedKeys.length) {
      card.appendChild(node("p", "empty", "No field updates this turn."));
    } else {
      acceptedKeys.forEach((key) => {
        card.appendChild(node("div", "chunk", "accepted " + (FIELD_LABELS[key] || key) + ": " + accepted[key]));
      });
      rejectedKeys.forEach((key) => {
        card.appendChild(node("div", "chunk", "rejected " + (FIELD_LABELS[key] || key) + ": " + rejected[key]));
      });
    }

    const proposed = turn.fields_proposed || [];
    if (proposed.length) {
      card.appendChild(node("div", "subhead", "Fields the model proposed"));
      proposed.forEach((item) => {
        if (!item || typeof item !== "object") return;
        const bits = [item.key, item.value, item.basis].filter(Boolean).join(" · ");
        if (bits) card.appendChild(node("div", "chunk", bits));
      });
    }

    card.appendChild(node("div", "subhead", "Retrieved KB chunks"));
    const chunks = turn.retrieved || [];
    if (!chunks.length) {
      card.appendChild(node("p", "empty", "No KB hit this turn."));
    } else {
      chunks.forEach((chunk) => {
        const row = node("div", "chunk");
        row.appendChild(node("b", null, (chunk.title || chunk.id || "chunk") + " "));
        row.appendChild(node("span", null, (chunk.id || "") + (chunk.score != null ? " · score " + chunk.score : "")));
        card.appendChild(row);
      });
    }
    return card;
  }

  function renderDebug() {
    if (!debugEnabled) {
      els.debugContent.hidden = true;
      els.debugEmpty.hidden = false;
      els.debugEmpty.textContent = "Debug panel hidden.";
      return;
    }
    if (!debugTurns.length) {
      els.debugContent.hidden = true;
      els.debugEmpty.hidden = false;
      els.debugEmpty.textContent = "Send a message to see the pipeline output.";
      clear(els.debugContent);
      return;
    }
    els.debugEmpty.hidden = true;
    els.debugContent.hidden = false;
    clear(els.debugContent);

    const latest = debugTurns[debugTurns.length - 1];
    els.debugContent.appendChild(node("p", "debug-note", "Conversation " + (latest.conversation_id || "") + " · " + debugTurns.length + " turns"));

    const all = [];
    debugTurns.forEach((turn, index) => {
      const label = "Turn " + (index + 1) + " · " + turnLabel(turn, index);
      (turn.issues || []).forEach((issue) => all.push({ label: label + " · sent", issue, severity: issue.severity }));
      draftGroups(turn).forEach((draft) => {
        const stage = draft.stage || "draft";
        (draft.issues || []).forEach((issue) => all.push({ label: label + " · " + stage, issue, severity: "block" }));
      });
    });

    els.debugContent.appendChild(node("h3", null, "All issues · " + all.length));
    if (!all.length) {
      els.debugContent.appendChild(node("p", "empty", "No guard issues in this chat."));
    } else {
      all.forEach((item) => {
        const row = issueRow(item.issue, item.severity);
        row.insertBefore(node("span", "who", item.label), row.firstChild);
        els.debugContent.appendChild(row);
      });
    }

    els.debugContent.appendChild(node("h3", null, "Goal checklist"));
    const goal = latest.goal || {};
    els.debugContent.appendChild(node("p", "ask-line", "Family: " + (goal.family || "unknown")));
    els.debugContent.appendChild(node("p", "ask-line", "Ask set: " + ((goal.ask && goal.ask.length) ? goal.ask.join(", ") : "(nothing)")));
    els.debugContent.appendChild(node("p", "ask-line", "Missing: " + ((goal.missing && goal.missing.length) ? goal.missing.join(", ") : "none")));
    const denied = (goal.do_not_ask || []).map((item) => item.key + ' ("' + clip(item.words, 48) + '")');
    els.debugContent.appendChild(node("p", "ask-line", "Do not ask: " + (denied.length ? denied.join(", ") : "(nothing yet)")));
    (goal.fields || []).forEach((field) => {
      const line = node("div", "goal-line");
      line.appendChild(node("b", null, (field.label || field.key) + ": " + (field.value || "—")));
      const meta = [field.status || "unknown", field.basis, field.attempts ? field.attempts + " tries" : ""].filter(Boolean);
      line.appendChild(node("span", null, meta.join(" · ")));
      els.debugContent.appendChild(line);
    });
    if (!goal.fields) {
      const known = latest.known || {};
      const keys = Object.keys(known);
      if (!keys.length) els.debugContent.appendChild(node("p", "empty", "No fields collected yet."));
      keys.forEach((key) => {
        els.debugContent.appendChild(node("div", "goal-line", (FIELD_LABELS[key] || key) + ": " + known[key]));
      });
    }

    els.debugContent.appendChild(node("h3", null, "Every turn"));
    debugTurns.forEach((turn, index) => els.debugContent.appendChild(renderTurn(turn, index)));
  }

  els.composer.addEventListener("submit", (event) => {
    event.preventDefault();
    sendMessage();
  });

  els.attachBtn.addEventListener("click", () => {
    if (!busy && !handoffLocked) els.attachInput.click();
  });

  els.attachClear.addEventListener("click", () => {
    clearPendingImage();
    els.input.focus();
  });

  els.attachInput.addEventListener("change", async () => {
    const file = els.attachInput.files && els.attachInput.files[0];
    if (!file) return;
    await acceptImageFile(file);
  });

  els.input.addEventListener("paste", handleImagePaste);
  els.composer.addEventListener("paste", handleImagePaste);

  els.input.addEventListener("input", () => {
    els.input.style.height = "auto";
    els.input.style.height = Math.min(els.input.scrollHeight, 140) + "px";
  });

  els.input.addEventListener("keydown", (event) => {
    if (event.key === "Enter" && !event.shiftKey) {
      event.preventDefault();
      sendMessage();
    }
  });

  els.newChat.addEventListener("click", () => {
    conversationId = newId();
    startChat();
  });

  els.debugToggle.addEventListener("change", () => {
    debugEnabled = els.debugToggle.checked;
    renderDebug();
  });

  loadHealth();
  startChat();
})();
</script>
</body>
</html>
